<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Foods of India</title>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --saffron:  #f97316;
      --turmeric: #f59e0b;
      --coral:    #ef4444;
      --teal:     #0d9488;
      --green:    #16a34a;
      --bg:       #ffffff;
      --bg2:      #f8f8f8;
      --surface:  #fef3c7;
      --text:     #1c1917;
      --muted:    #78716c;
      --border:   #fed7aa;
      --shadow:   0 6px 32px rgba(249,115,22,.13);
    }

    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box }

    body {
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      min-height: 100vh;
      background:
        url('https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Rangoli.jpg/1920px-Rangoli.jpg')
        center center / cover fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text);
    }

    /* ── HEADER ── */
    header {
      width: 100%;
      background: linear-gradient(110deg, #ff9933 0%, #ffb347 35%, #ffffff 60%, #4caf50 100%);
      text-align: center;
      padding: 22px 16px 16px;
      box-shadow: 0 3px 20px rgba(249,115,22,.22);
      position: relative;
      overflow: hidden;
    }
    /* subtle mandala-like ring decoration */
    header::before {
      content: '';
      position: absolute;
      width: 320px; height: 320px;
      border-radius: 50%;
      border: 40px solid rgba(255,255,255,.12);
      top: -120px; left: -80px;
      pointer-events: none;
    }
    header::after {
      content: '';
      position: absolute;
      width: 220px; height: 220px;
      border-radius: 50%;
      border: 30px solid rgba(255,255,255,.10);
      bottom: -100px; right: -60px;
      pointer-events: none;
    }
    header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      color: #7c2d12;
      letter-spacing: .4px;
      position: relative;
      text-shadow: 0 1px 0 rgba(255,255,255,.6);
    }
    header p {
      color: #92400e;
      margin-top: 5px;
      font-size: .88rem;
      position: relative;
      font-weight: 500;
    }

    /* ── LAYOUT ── */
    .container { 
      display:flex; 
      justify-content:center; 
      align-items:flex-start;
      gap:32px;
      padding:32px 20px 16px; 
      width:100%;
      max-width:1400px;
    }

    /* ── SIDE PANEL ── */
    #side-panel {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: var(--shadow), 0 0 0 2px var(--border);
      padding: 28px 24px 24px;
      width: 420px;
      min-height: 500px;
      max-height: 85vh;
      overflow-y: auto;
      position: sticky;
      top: 20px;
      flex-shrink: 0;
      scrollbar-width: thin;
      scrollbar-color: #fed7aa transparent;
    }
    #side-panel::-webkit-scrollbar { width:5px }
    #side-panel::-webkit-scrollbar-thumb { background:#fed7aa; border-radius:4px }

    .placeholder { text-align:center; color:#bbb; padding:40px 20px }
    .placeholder .icon { font-size:4rem; margin-bottom:16px }
    .placeholder p { font-size:1.05rem; line-height:1.6 }

    /* ── SIDE PANEL CONTENT ── */
    .sname {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .cap { font-size:1rem; color:#a8a29e; margin-bottom:22px; font-weight:500 }
    .dtitle {
      font-size:.85rem;
      text-transform:uppercase;
      letter-spacing:1.4px;
      font-weight:700;
      margin-bottom:14px;
    }

    /* ── DISH LIST ── */
    .dlist { list-style:none; display:flex; flex-direction:column; gap:10px }
    .dlist li {
      display:flex; align-items:center; gap:13px;
      border-radius:14px;
      padding:8px 12px 8px 8px;
      border-left:4px solid var(--saffron);
      animation: si .22s ease both;
      overflow:hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }
    .dlist li:nth-child(1){animation-delay:.03s}
    .dlist li:nth-child(2){animation-delay:.09s}
    .dlist li:nth-child(3){animation-delay:.15s}
    .dlist li:nth-child(4){animation-delay:.21s}

    .dish-img {
      width:72px; height:72px;
      border-radius:10px;
      object-fit:cover;
      flex-shrink:0;
      background:#ffedd5;
    }
    .dish-fallback {
      width:72px; height:72px;
      border-radius:10px;
      flex-shrink:0;
      background:#fce7f3;
      display:flex; align-items:center; justify-content:center;
      font-size:2.2rem;
    }
    .dish-name { font-weight:600; font-size:1.05rem; color:#1c1917 }

    /* ── TASTE BADGE ── */
    .taste-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: .72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      margin-top: 5px;
      letter-spacing: .4px;
      text-transform: uppercase;
    }
    .taste-badge.spicy   { background:#fff1f0; color:#c0392b; border:1px solid #fca5a5 }
    .taste-badge.savoury { background:#f0fdf4; color:#166534; border:1px solid #86efac }
    .taste-badge.sweet   { background:#fdf4ff; color:#7e22ce; border:1px solid #d8b4fe }
    .taste-badge.mild    { background:#fffbeb; color:#92400e; border:1px solid #fcd34d }

    /* ── INGREDIENTS ── */
    .dish-detail {
      margin-top: 7px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      animation: si .18s ease both;
    }
    .ingredients-label {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-top: 2px;
    }
    .ingredients-text {
      font-size: .82rem;
      color: #44403c;
      line-height: 1.5;
    }
    .city-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: .78rem;
      font-weight: 600;
      color: #0369a1;
      background: #e0f2fe;
      border: 1px solid #7dd3fc;
      border-radius: 20px;
      padding: 3px 10px;
      margin-top: 5px;
      width: fit-content;
    }
    .year-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: .78rem;
      font-weight: 600;
      color: #92400e;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 20px;
      padding: 3px 10px;
      margin-top: 5px;
      width: fit-content;
    }

    .dish-info { display:flex; flex-direction:column }

    /* clickable dish row */
    .dlist li { cursor:pointer }
    .dlist li:hover { filter: brightness(.97) }

    @keyframes si {
      from { opacity:0; transform:translateX(-10px) }
      to   { opacity:1; transform:translateX(0) }
    }

    /* ── MAP ── */
    #map-wrap {
      position: relative;
      background: #1e3a5f;
      border-radius: 20px;
      box-shadow: var(--shadow), 0 0 0 4px var(--border);
      border: 3px solid var(--saffron);
      overflow: hidden;
      flex-shrink: 0;
    }
    #map-wrap svg { display:block }

    .state { stroke:#fff; stroke-width:.7; cursor:pointer; transition:filter .15s }
    .state:hover  { filter: brightness(1.15) drop-shadow(0 0 6px rgba(249,115,22,.55)) }
    .state.active { filter: brightness(.88) drop-shadow(0 0 8px rgba(13,148,136,.6)) }

    /* ── TOOLTIP ── */
    #tip {
      position: fixed;
      background: #1c1917;
      color: #fff;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: .76rem;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity .12s;
      z-index: 999;
      white-space: nowrap;
      border-left: 3px solid var(--saffron);
      letter-spacing: .3px;
    }

    /* ── LOADING ── */
    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .9rem; color: #7fa8cc;
      background: #1e3a5f;
    }

    /* ── HINT & FOOTER ── */
    #hint {
      text-align:center;
      color: var(--muted);
      font-size:.82rem;
      margin-top:16px;
      margin-bottom:12px;
      letter-spacing:.2px;
    }
    footer {
      text-align:center;
      padding:16px;
      color: var(--muted);
      font-size:.76rem;
      border-top: 2px dashed var(--border);
      width:100%;
      margin-top:auto;
    }

    @media(max-width:1100px){
      .container { flex-direction:column; align-items:center }
      #side-panel { width:95%; max-width:480px; position:relative; top:0 }
    }
    @media(max-width:640px){
      header h1{font-size:2rem}
      #side-panel{padding:22px 16px 18px}
      .dish-img,.dish-fallback{width:52px;height:52px}
    }
  </style>

</head>

<script>

(async () => {

  const W = Math.min(720, window.innerWidth - 32);
  const H = Math.round(W * 1.18);

  const wrap    = document.getElementById("map-wrap");
  const loading = document.getElementById("loading");
  const tip     = document.getElementById("tip");



  wrap.style.width  = W + "px";

  wrap.style.height = H + "px";



  const svg = d3.select("#map-wrap").append("svg").attr("width", W).attr("height", H);

  const projection = d3.geoMercator().center([82.5, 22.5]).scale(W * 1.55).translate([W/2, H/2]);

  const pathGen = d3.geoPath().projection(projection);



  let topo;

  try {

    topo = await d3.json("https://raw.githubusercontent.com/udit-001/india-maps-data/main/topojson/india.json");

  } catch {

    loading.textContent = "⚠️ Could not load map. Check your internet connection.";

    return;

  }

  loading.remove();



  const features = topojson.feature(topo, topo.objects.states).features;



  svg.selectAll(".state")

    .data(features).join("path")

    .attr("class", "state")

    .attr("d", pathGen)

    .style("fill", d => (FOOD[d.properties.st_nm] || {}).color || "#90caf9")

    .on("mouseenter", function(event, d) {
      tip.textContent = d.properties.st_nm;
      tip.style.opacity = "1";
    })
    .on("mousemove", function(event) {

  "Fish Curry":        "https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/South_Indian_Fish_Curry_with_Steamed_Rice-Chennai-TamilNadu-DSC0001.jpg/330px-South_Indian_Fish_Curry_with_Steamed_Rice-Chennai-TamilNadu-DSC0001.jpg",
  "Coconut Prawn Curry":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Prawn_Malai_Curry.jpg/330px-Prawn_Malai_Curry.jpg",
  // Ladakh — verified 330px Wikimedia URLs
  "Thukpa":            "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7f/Thukpa%2C_Tibetan_noodle_in_Osaka%2C_Japan.jpg/330px-Thukpa%2C_Tibetan_noodle_in_Osaka%2C_Japan.jpg",
  "Butter Tea":        "https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Tibetan_butter_tea.jpg/330px-Tibetan_butter_tea.jpg",
  "Tingmo":            "https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Tingmo_or_Ting_Momo.JPG/330px-Tingmo_or_Ting_Momo.JPG",
};

  // Fetch image: use curated map first, then Wikipedia API, then emoji fallback
  async function loadWikiImg(imgEl, fallbackEl, dishName) {
    // 1. Use curated image map
    if (DISH_IMAGES[dishName]) {
      imgEl.src = DISH_IMAGES[dishName];
      imgEl.style.display = "block";
      fallbackEl.style.display = "none";
      imgEl.onerror = () => { imgEl.style.display = "none"; fallbackEl.style.display = "flex"; };
      return;
    }
    // 2. Fall back to Wikipedia API
    try {
      // Some dish names need a different Wikipedia article slug
      const slugMap = {
        "Chettinad Chicken": "Chettinad_cuisine",
        "Idli Sambar":       "Idli",
        "Sarson da Saag":    "Sarson_da_saag",
        "Lucknowi Biryani":  "Lucknawi_cuisine",
        "Tunday Kababi":     "Tunde_ke_kabab",
        "Litti Chokha":      "Litti_chokha",
        "Dal Baati Churma":  "Dal_baati_churma",
        "Laal Maas":         "Laal_maans",
        "Ker Sangri":        "Ker_sangri",
        "Hyderabadi Biryani":"Hyderabadi_biryani",
        "Rogan Josh":        "Rogan_josh",
        "Dum Aloo":          "Dum_aloo",
        "Masala Dosa":       "Masala_dosa",
        "Bisi Bele Bath":    "Bisi_bele_bath",
        "Mysore Pak":        "Mysore_pak",
        "Appam & Stew":      "Appam",
        "Kerala Fish Curry": "Fish_curry",
        "Puttu & Kadala":    "Puttu",
        "Vada Pav":          "Vada_pav",
        "Puran Poli":        "Puran_poli",
        "Misal Pav":         "Misal_pav",
        "Fish Curry Rice":   "Goan_cuisine",
        "Prawn Balchão":     "Balchão",
        "Amritsari Kulcha":  "Kulcha",
        "Butter Chicken":    "Butter_chicken",
        "Chole Bhature":     "Chole_bhature",
        "Jalebi":            "Jalebi",
        "Rosogolla":         "Rasgulla",
        "Macher Jhol":       "Macher_jhol",
        "Mishti Doi":        "Mishti_doi",
        "Momos":             "Momo_(food)",
        "Dhokla":            "Dhokla",
        "Undhiyu":           "Undhiyu",
        "Ghevar":            "Ghevar",
        "Petha":             "Petha_(confectionery)",
        "Bal Mithai":        "Bal_mithai",
        "Haleem":            "Haleem",
        "Masor Tenga":       "Masor_tenga",
        "Thukpa":            "Thukpa",
        "Butter Tea":        "Butter_tea",
        "Tingmo":            "Tingmo",
      };
      const raw  = slugMap[dishName] || dishName.replace(/ /g, "_");
      const slug = encodeURIComponent(raw);
      const res  = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${slug}`);
      if (!res.ok) throw new Error();
      const data = await res.json();
      const url  = data?.thumbnail?.source;
      if (url) { imgEl.src = url; imgEl.style.display = "block"; fallbackEl.style.display = "none"; }
      else throw new Error();
    } catch { imgEl.style.display = "none"; fallbackEl.style.display = "flex"; }
  }

  const TASTE_LABEL = {
    sp: { label:"🌶️ Spicy",   cls:"spicy"   },
    sv: { label:"🧂 Savoury", cls:"savoury" },
    sw: { label:"🍬 Sweet",   cls:"sweet"   },
    mi: { label:"🌿 Mild",    cls:"mild"    },
  };

  function dishHTML(x, color) {
    const bg = color + "18";
    return `<li style="border-left-color:${color};background:${bg}" data-dish="${x.n}" data-emoji="${x.e}" data-taste="${x.t || 'sv'}" data-ki="${x.ki || ''}" data-city="${x.city || ''}" data-yr="${x.yr || ''}">
      <img class="dish-img" style="display:none" alt="${x.n}">
      <span class="dish-fallback">${x.e}</span>
      <span class="dish-info">
        <span class="dish-name">${x.n}</span>
      </span>
    </li>`;
  }

  function attachTasteClicks() {
    document.querySelectorAll(".dlist li[data-taste]").forEach(li => {
      li.addEventListener("click", () => {
        const info = li.querySelector(".dish-info");
        const existing = info.querySelector(".dish-detail");
        if (existing) { existing.remove(); return; }

        const t    = li.dataset.taste;
        const ki   = li.dataset.ki;
        const city = li.dataset.city;
        const yr   = li.dataset.yr;
        const { label, cls } = TASTE_LABEL[t] || TASTE_LABEL.sv;

        const detail = document.createElement("div");
        detail.className = "dish-detail";
        detail.innerHTML = `
          <span class="taste-badge ${cls}">${label}</span>
          ${city ? `<span class="city-tag">📍 Best in ${city}</span>` : ""}
          ${yr   ? `<span class="year-tag">📅 Famous since ${yr}</span>` : ""}
          ${ki   ? `<span class="ingredients-label">🧄 Key Ingredients</span>
                    <span class="ingredients-text">${ki}</span>` : ""}
        `;
        info.appendChild(detail);
      });
    });
  }

  function loadImages() {
    document.querySelectorAll(".dlist li[data-dish]").forEach(li => {
      loadWikiImg(li.querySelector(".dish-img"), li.querySelector(".dish-fallback"), li.dataset.dish);
    });
  }



  const panel = document.getElementById("side-panel");

  function showSidePanel(name) {
    const d = FOOD[name];
    const color = (d && d.color) || "#ff9933";
    if (!d) {
      panel.innerHTML = `<div class="sname" style="color:${color}">${name}</div>
        <div class="cap" style="margin-top:10px;color:#bbb">Dish data coming soon!</div>`;
    } else {
      panel.style.borderTop = `5px solid ${color}`;
      panel.innerHTML = `
        <div class="sname" style="color:${color}">${name}</div>
        <div class="cap">🏛️ Capital: ${d.cap}</div>
        <div class="dtitle" style="color:${color}">🍽️ Famous Dishes</div>
        <ul class="dlist">${d.dishes.map(x => dishHTML(x, color)).join("")}</ul>`;
    }
    requestAnimationFrame(() => { loadImages(); attachTasteClicks(); });
  }

})();

</script>
