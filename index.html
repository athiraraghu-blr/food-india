  <style>

    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

    body{font-family:'Segoe UI',sans-serif;min-height:100vh;background:#f0ece3;display:flex;flex-direction:column;align-items:center}

    header{width:100%;background:linear-gradient(90deg,#ff9933 0%,#fff 50%,#138808 100%);text-align:center;padding:20px 16px 14px;box-shadow:0 2px 10px rgba(0,0,0,.13)}

    header h1{font-size:2rem;color:#1a1a1a}

    header p{color:#444;margin-top:5px;font-size:.92rem}

    .container{display:flex;justify-content:center;padding:32px 20px 48px;width:100%}

    #map-wrap{position:relative;background:#ddeeff;border-radius:16px;box-shadow:0 6px 28px rgba(0,0,0,.15);overflow:hidden;flex-shrink:0}

    #map-wrap svg{display:block}

    .state{stroke:#fff;stroke-width:.7;cursor:pointer;transition:fill .15s,filter .15s}

    .state:hover{filter:brightness(1.18) drop-shadow(0 0 4px rgba(0,0,0,.25))}

    .state.active{filter:brightness(.82) drop-shadow(0 0 6px rgba(0,0,0,.4))}

    #tip{position:fixed;background:rgba(0,0,0,.72);color:#fff;padding:4px 10px;border-radius:6px;font-size:.78rem;pointer-events:none;opacity:0;transition:opacity .12s;z-index:999;white-space:nowrap}

    #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.9rem;color:#555;background:#ddeeff}

    #overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .22s ease;padding:16px}

    #overlay.show{opacity:1;pointer-events:all}

    #popup{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.28);padding:28px 24px 24px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;position:relative;transform:scale(.88) translateY(20px);transition:transform .25s cubic-bezier(.34,1.56,.64,1);scrollbar-width:thin}

    #popup::-webkit-scrollbar{width:5px}

    #popup::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px}

    #overlay.show #popup{transform:scale(1) translateY(0)}

    #close-btn{position:absolute;top:14px;right:16px;background:#f5f5f5;border:none;border-radius:50%;width:32px;height:32px;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555;transition:background .15s}

    #close-btn:hover{background:#ffe0e0;color:#e53935}

    .sname{font-size:1.5rem;font-weight:700;margin-bottom:3px;padding-right:36px}

    .cap{font-size:.82rem;color:#999;margin-bottom:18px}

    .dtitle{font-size:.73rem;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-bottom:12px}

    .dlist{list-style:none;display:flex;flex-direction:column;gap:10px}

    .dlist li{display:flex;align-items:center;gap:13px;border-radius:12px;padding:8px 12px 8px 8px;border-left:4px solid #ff9933;animation:si .22s ease both;overflow:hidden}

    .dlist li:nth-child(1){animation-delay:.03s}

    .dlist li:nth-child(2){animation-delay:.09s}

    .dlist li:nth-child(3){animation-delay:.15s}

    .dlist li:nth-child(4){animation-delay:.21s}

    .dish-img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#eee}

    .dish-fallback{width:64px;height:64px;border-radius:10px;flex-shrink:0;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:2rem}

    .dish-name{font-weight:600;font-size:.92rem;color:#222}

    @keyframes si{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}

    #hint{text-align:center;color:#888;font-size:.83rem;margin-top:-16px;margin-bottom:8px}

    footer{text-align:center;padding:12px;color:#888;font-size:.77rem}

    @media(max-width:640px){header h1{font-size:1.4rem}#popup{padding:22px 16px 18px}.dish-img,.dish-fallback{width:52px;height:52px}}

  </style>

</head>

<script>

(async () => {

  const W = Math.min(540, window.innerWidth - 32);

  const H = Math.round(W * 1.18);

  const wrap    = document.getElementById("map-wrap");

  const loading = document.getElementById("loading");

  const overlay = document.getElementById("overlay");

  const content = document.getElementById("popup-content");

  const closeBtn= document.getElementById("close-btn");

  const tip     = document.getElementById("tip");



  wrap.style.width  = W + "px";

  wrap.style.height = H + "px";



  const svg = d3.select("#map-wrap").append("svg").attr("width", W).attr("height", H);

  const projection = d3.geoMercator().center([82.5, 22.5]).scale(W * 1.55).translate([W/2, H/2]);

  const pathGen = d3.geoPath().projection(projection);



  let topo;

  try {

    topo = await d3.json("https://raw.githubusercontent.com/udit-001/india-maps-data/main/topojson/india.json");

  } catch {

    loading.textContent = "⚠️ Could not load map. Check your internet connection.";

    return;

  }

  loading.remove();



  const features = topojson.feature(topo, topo.objects.states).features;



  svg.selectAll(".state")

    .data(features).join("path")

    .attr("class", "state")

    .attr("d", pathGen)

    .style("fill", d => (FOOD[d.properties.st_nm] || {}).color || "#90caf9")

    .on("mouseenter", function(event, d) {

      tip.textContent = d.properties.st_nm;

      tip.style.opacity = "1";

    })

    .on("mousemove", function(event) {

      tip.style.left = (event.clientX + 14) + "px";

      tip.style.top  = (event.clientY - 30) + "px";

    })

    .on("mouseleave", function() {

      tip.style.opacity = "0";

    })

    .on("click", function(event, d) {

      d3.selectAll(".state.active").classed("active", false);

      d3.select(this).classed("active", true);

      openPopup(d.properties.st_nm);

    });



  // Fetch Wikipedia thumbnail for a dish name, fall back to emoji
  async function loadWikiImg(imgEl, fallbackEl, dishName) {
    try {
      const slug = encodeURIComponent(dishName.replace(/ /g, "_"));
      const res  = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${slug}`);
      if (!res.ok) throw new Error();
      const data = await res.json();
      const url  = data?.thumbnail?.source;
      if (url) { imgEl.src = url; imgEl.style.display = "block"; fallbackEl.style.display = "none"; }
      else throw new Error();
    } catch { imgEl.style.display = "none"; fallbackEl.style.display = "flex"; }
  }

  function dishHTML(x, color) {
    const bg = color + "18";
    return `<li style="border-left-color:${color};background:${bg}" data-dish="${x.n}" data-emoji="${x.e}">
      <img class="dish-img" style="display:none" alt="${x.n}">
      <span class="dish-fallback">${x.e}</span>
      <span class="dish-name">${x.n}</span>
    </li>`;
  }

  function loadImages() {
    document.querySelectorAll(".dlist li[data-dish]").forEach(li => {
      loadWikiImg(li.querySelector(".dish-img"), li.querySelector(".dish-fallback"), li.dataset.dish);
    });
  }



  function openPopup(name) {

    const d = FOOD[name];

    const color = (d && d.color) || "#ff9933";

    document.getElementById("popup").style.borderTop = `5px solid ${color}`;

    if (!d) {

      content.innerHTML = `<div class="sname" style="color:${color}">${name}</div>

        <div class="cap" style="margin-top:10px;color:#bbb">Dish data coming soon!</div>`;

    } else {

      content.innerHTML = `

        <div class="sname" style="color:${color}">${name}</div>

        <div class="cap">🏛️ Capital: ${d.cap}</div>

        <div class="dtitle" style="color:${color}">🍽️ Famous Dishes</div>

        <ul class="dlist">${d.dishes.map(x => dishHTML(x, color)).join("")}</ul>`;
    }
    overlay.classList.add("show");
    // load images after DOM is updated
    requestAnimationFrame(loadImages);

  }



  function closePopup() {

    overlay.classList.remove("show");

    document.getElementById("popup").style.borderTop = "";

    d3.selectAll(".state.active").classed("active", false);

  }



  closeBtn.addEventListener("click", closePopup);

  overlay.addEventListener("click", e => { if (e.target === overlay) closePopup(); });

  document.addEventListener("keydown", e => { if (e.key === "Escape") closePopup(); });

})();

</script>
